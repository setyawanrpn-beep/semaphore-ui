---
- name: Professional Patch Management v3
  hosts: all
  gather_facts: yes
  become: false

  tasks:

    # =========================================================
    # BEFORE PATCH
    # =========================================================

    - name: Record kernel before patch
      ansible.builtin.set_fact:
        kernel_before: "{{ ansible_kernel }}"

    - name: Check package health before patch
      ansible.builtin.shell: dpkg --audit
      register: dpkg_audit_before
      changed_when: false
      failed_when: false

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
      become: yes
      become_method: sudo
      become_user: root
      become_flags: "-n"

    - name: Check available updates
      ansible.builtin.shell: |
        apt list --upgradable 2>/dev/null | tail -n +2
      register: available_updates
      changed_when: false
      failed_when: false

    - name: Calculate available patch count
      ansible.builtin.set_fact:
        available_patch_count: >-
          {{
            available_updates.stdout_lines
            | select('match', '^[^ ]+')
            | list
            | length
          }}

    # =========================================================
    # PATCH
    # =========================================================

    - name: Apply available patches
      ansible.builtin.apt:
        upgrade: yes
        autoremove: no
        autoclean: yes
      become: yes
      become_method: sudo
      become_user: root
      become_flags: "-n"
      register: patch_result
      when: available_patch_count | int > 0

    - name: Set patch status
      ansible.builtin.set_fact:
        patch_status: >-
          {{
            'COMPLIANT'
            if available_patch_count | int == 0
            else (
              'PATCHED'
              if patch_result.changed | default(false)
              else 'ATTENTION'
            )
          }}

    # =========================================================
    # REBOOT CHECK
    # =========================================================

    - name: Check whether reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Set reboot required status
      ansible.builtin.set_fact:
        reboot_required: "{{ reboot_required_file.stat.exists | default(false) }}"

    # =========================================================
    # REBOOT
    # =========================================================

    - name: Reboot server
      ansible.builtin.shell: |
        (sleep 2; sudo -n /sbin/reboot) >/dev/null 2>&1 &
      async: 1
      poll: 0
      become: false
      when: reboot_required | bool

    - name: Wait for server to return
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 300
      when: reboot_required | bool

    # =========================================================
    # AFTER REBOOT
    # =========================================================

    - name: Gather facts after reboot
      ansible.builtin.setup:
      when: reboot_required | bool

    - name: Record kernel after patch
      ansible.builtin.set_fact:
        kernel_after: "{{ ansible_kernel }}"

    - name: Check package health after patch
      ansible.builtin.shell: dpkg --audit
      register: dpkg_audit_after
      changed_when: false
      failed_when: false

    # =========================================================
    # REMAINING PATCHES
    # =========================================================

    - name: Check remaining updates
      ansible.builtin.shell: |
        apt list --upgradable 2>/dev/null | tail -n +2
      register: remaining_updates
      changed_when: false
      failed_when: false

    - name: Calculate remaining patch count
      ansible.builtin.set_fact:
        remaining_patch_count: >-
          {{
            remaining_updates.stdout_lines
            | select('match', '^[^ ]+')
            | list
            | length
          }}

    # =========================================================
    # OVERALL STATUS
    # =========================================================

    - name: Determine overall status
      ansible.builtin.set_fact:
        overall_status: >-
          {{
            'SUCCESS'
            if (
              remaining_patch_count | int == 0
              and (
                not reboot_required | bool
                or reboot_required | bool
              )
              and (dpkg_audit_after.stdout | trim == '')
            )
            else 'ATTENTION'
          }}

    # =========================================================
    # FINAL REPORT
    # =========================================================

    - name: Patch Management Report
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "       PATCH MANAGEMENT REPORT v3"
          - "=============================================="
          - "Host               : {{ inventory_hostname }}"
          - "OS                 : {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Kernel Before      : {{ kernel_before }}"
          - "Kernel After       : {{ kernel_after }}"
          - "Available Patches  : {{ available_patch_count }}"
          - "Patch Status       : {{ patch_status }}"
          - "Reboot Required    : {{ reboot_required }}"
          - "Reboot Status      : {{ 'COMPLETED' if reboot_required else 'NOT REQUIRED' }}"
          - "Remaining Updates  : {{ remaining_patch_count }}"
          - "Package Health     : {{ 'OK' if dpkg_audit_after.stdout | trim == '' else 'ATTENTION' }}"
          - "Overall Status     : {{ overall_status }}"
          - "=============================================="
